name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev build-essential ccache libltdl-dev
        python -m pip install --upgrade pip
        python -m pip install --upgrade setuptools wheel
        python -m pip install cython==0.29.33 buildozer

    - name: Clean previous builds
      run: |
        rm -rf ~/.buildozer bin .buildozer

    - name: Build with Buildozer
      run: |
        export CFLAGS="-I$(python -c 'import sys; print(sys.exec_prefix)')/include/python3.10"
        export LDFLAGS="-L$(python -c 'import sys; print(sys.exec_prefix)')/lib"
        python -m buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
